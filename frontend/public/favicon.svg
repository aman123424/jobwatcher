<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="31" fill="#aa3bff" stroke="#c084fc" stroke-width="2"/>

  <!-- AK monogram: the right leg of A and the vertical stroke of K are
       the SAME stroke (x=32, from the apex down to the baseline) -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- A: left leg (apex to bottom-left) -->
    <path d="M 32 13 L 14 51" />
    <!-- A: crossbar -->
    <path d="M 20 37 L 32 37" />
    <!-- shared spine: A's right leg AND K's vertical stroke -->
    <path d="M 32 13 L 32 51" />
    <!-- K: upper diagonal -->
    <path d="M 32 33 L 49 15" />
    <!-- K: lower diagonal -->
    <path d="M 32 33 L 49 51" />
  </g>
</svg>
